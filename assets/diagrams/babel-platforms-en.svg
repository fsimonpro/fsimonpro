  <path class="link" d="M152.5,161 C170.5,161 170.5,38 188.5,38" marker-end="url(#arrow)" />
  <path class="link" d="M152.5,161 C170.5,161 170.5,120 188.5,120" marker-end="url(#arrow)" />
  <path class="link" d="M152.5,161 C170.5,161 170.5,202 188.5,202" marker-end="url(#arrow)" />
  <path class="link" d="M152.5,161 C170.5,161 170.5,284 188.5,284" marker-end="url(#arrow)" />
