<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 76" width="1130" height="76" role="img" aria-label="IA du jeu de dames">
<style>
  .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
  .hub { fill: #ddf4ff; stroke: #0969da; stroke-width: 2; }
  .now { stroke: #0969da; stroke-width: 2; }
  .date { fill: #0969da; font: 700 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .name { fill: #1f2328; font: 700 14px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .info { fill: #59636e; font: 400 12.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .lbl { fill: #59636e; font: italic 400 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .lblbg { fill: #ffffff; }
  .link { stroke: #8c959f; stroke-width: 2; fill: none; }
  .head { fill: #8c959f; }
  @media (prefers-color-scheme: dark) {
    .box { fill: #161b22; stroke: #30363d; }
    .hub { fill: #0c2d6b; stroke: #4493f8; }
    .now { stroke: #4493f8; }
    .date { fill: #4493f8; }
    .name { fill: #e6edf3; }
    .info, .lbl { fill: #9198a1; }
    .lblbg { fill: #0d1117; }
    .link { stroke: #6e7681; }
    .head { fill: #6e7681; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z" /></marker></defs>
  <path class="link" d="M185.79999999999998,38 C203.79999999999998,38 203.79999999999998,38 221.79999999999998,38" marker-end="url(#arrow)" />
  <path class="link" d="M349.79999999999995,38 C367.79999999999995,38 367.79999999999995,38 385.79999999999995,38" marker-end="url(#arrow)" />
  <path class="link" d="M513.8,38 C531.8,38 531.8,38 549.8,38" marker-end="url(#arrow)" />
  <path class="link" d="M677.8,38 C695.8,38 695.8,38 713.8,38" marker-end="url(#arrow)" />
  <path class="link" d="M901.5999999999999,38 C919.5999999999999,38 919.5999999999999,38 937.5999999999999,38" marker-end="url(#arrow)" />
  <rect class="box" x="6" y="6" width="179.79999999999998" height="64" rx="10" />
  <text text-anchor="middle"><tspan class="name" x="95.89999999999999" y="33">Générateur de coups</tspan><tspan class="info" x="95.89999999999999" y="51">prises multiples, dames</tspan></text>
  <rect class="box" x="229.79999999999998" y="6" width="120" height="64" rx="10" />
  <text text-anchor="middle"><tspan class="name" x="289.79999999999995" y="42">Minimax</tspan></text>
  <rect class="box" x="393.79999999999995" y="6" width="120" height="64" rx="10" />
  <text text-anchor="middle"><tspan class="name" x="453.79999999999995" y="42">Alpha-bêta</tspan></text>
  <rect class="box" x="557.8" y="6" width="120" height="64" rx="10" />
  <text text-anchor="middle"><tspan class="name" x="617.8" y="33">Table de</tspan><tspan class="info" x="617.8" y="51">transposition</tspan></text>
  <rect class="box" x="721.8" y="6" width="179.79999999999998" height="64" rx="10" />
  <text text-anchor="middle"><tspan class="name" x="811.6999999999999" y="33">Approfondissement</tspan><tspan class="info" x="811.6999999999999" y="51">itératif, tri des coups</tspan></text>
  <rect class="hub" x="945.5999999999999" y="6" width="178.1" height="64" rx="24" />
  <text text-anchor="middle"><tspan class="name" x="1034.6499999999999" y="33">Minimax parallélisé</tspan><tspan class="info" x="1034.6499999999999" y="51">processus (fork)</tspan></text>
</svg>
