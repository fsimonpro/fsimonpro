    .now { stroke: #4493f8; }
    .date { fill: #4493f8; }
    .name { fill: #e6edf3; }
    .info, .lbl { fill: #9198a1; }
    .lblbg { fill: #0d1117; }
    .link { stroke: #6e7681; }
    .head { fill: #6e7681; }
  }
</style>
