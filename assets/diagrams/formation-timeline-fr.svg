<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1136 94" width="1136" height="94" role="img" aria-label="Frise de formation 2000-2005">
<style>
  .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
  .hub { fill: #ddf4ff; stroke: #0969da; stroke-width: 2; }
  .now { stroke: #0969da; stroke-width: 2; }
  .date { fill: #0969da; font: 700 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .name { fill: #1f2328; font: 700 14px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .info { fill: #59636e; font: 400 12.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .lbl { fill: #59636e; font: italic 400 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .lblbg { fill: #ffffff; }
  .link { stroke: #8c959f; stroke-width: 2; fill: none; }
  .head { fill: #8c959f; }
  @media (prefers-color-scheme: dark) {
    .box { fill: #161b22; stroke: #30363d; }
    .hub { fill: #0c2d6b; stroke: #4493f8; }
    .now { stroke: #4493f8; }
    .date { fill: #4493f8; }
    .name { fill: #e6edf3; }
    .info, .lbl { fill: #9198a1; }
    .lblbg { fill: #0d1117; }
    .link { stroke: #6e7681; }
    .head { fill: #6e7681; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z" /></marker></defs>
  <path class="link" d="M126,47 C144,47 144,47 162,47" marker-end="url(#arrow)" />
  <path class="link" d="M316.5,47 C334.5,47 334.5,47 352.5,47" marker-end="url(#arrow)" />
  <path class="link" d="M487.5,47 C505.5,47 505.5,47 523.5,47" marker-end="url(#arrow)" />
  <path class="link" d="M684.9,47 C702.9,47 702.9,47 720.9,47" marker-end="url(#arrow)" />
  <path class="link" d="M891.2,47 C909.2,47 909.2,47 927.2,47" marker-end="url(#arrow)" />
  <rect class="box" x="6" y="6" width="120" height="82" rx="10" />
  <text text-anchor="middle"><tspan class="date" x="66" y="33">2000</tspan><tspan class="name" x="66" y="51">Bac S</tspan><tspan class="info" x="66" y="69">mention bien</tspan></text>
  <rect class="box" x="170" y="6" width="146.5" height="82" rx="10" />
  <text text-anchor="middle"><tspan class="date" x="243.25" y="33">2000 – 2002</tspan><tspan class="name" x="243.25" y="51">Prépa MPSI, MP*</tspan><tspan class="info" x="243.25" y="69">Lycée Champollion</tspan></text>
  <rect class="box" x="360.5" y="6" width="127" height="82" rx="10" />
  <text text-anchor="middle"><tspan class="date" x="424" y="33">2002 – 2004</tspan><tspan class="name" x="424" y="51">ENSIMAG</tspan><tspan class="info" x="424" y="69">1re et 2e année</tspan></text>
  <rect class="box" x="531.5" y="6" width="153.39999999999998" height="82" rx="10" />
  <text text-anchor="middle"><tspan class="date" x="608.2" y="33">Été 2004</tspan><tspan class="name" x="608.2" y="51">Stage INSERM</tspan><tspan class="info" x="608.2" y="69">réseaux de neurones</tspan></text>
  <rect class="box" x="728.9" y="6" width="162.3" height="82" rx="10" />
  <text text-anchor="middle"><tspan class="date" x="810.05" y="33">2004 – 2005</tspan><tspan class="name" x="810.05" y="51">Univ. de Waterloo</tspan><tspan class="info" x="810.05" y="69">3e année</tspan></text>
  <rect class="box" x="935.2" y="6" width="193.9" height="82" rx="10" />
  <text text-anchor="middle"><tspan class="date" x="1032.15" y="33">2005</tspan><tspan class="name" x="1032.15" y="51">Stage de fin d'études</tspan><tspan class="info" x="1032.15" y="69">White Birds</tspan></text>
