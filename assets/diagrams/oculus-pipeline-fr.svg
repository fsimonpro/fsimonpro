<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 76" width="1000" height="76" role="img" aria-label="Chaîne de rendu VR sur Oculus Rift">
<style>
  .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
  .hub { fill: #ddf4ff; stroke: #0969da; stroke-width: 2; }
  .now { stroke: #0969da; stroke-width: 2; }
  .date { fill: #0969da; font: 700 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .name { fill: #1f2328; font: 700 14px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .info { fill: #59636e; font: 400 12.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .lbl { fill: #59636e; font: italic 400 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .lblbg { fill: #ffffff; }
  .link { stroke: #8c959f; stroke-width: 2; fill: none; }
  .head { fill: #8c959f; }
  @media (prefers-color-scheme: dark) {
    .box { fill: #161b22; stroke: #30363d; }
    .hub { fill: #0c2d6b; stroke: #4493f8; }
    .now { stroke: #4493f8; }
    .date { fill: #4493f8; }
    .name { fill: #e6edf3; }
    .info, .lbl { fill: #9198a1; }
    .lblbg { fill: #0d1117; }
    .link { stroke: #6e7681; }
    .head { fill: #6e7681; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z" /></marker></defs>
  <path class="link" d="M207.8,38 C225.8,38 225.8,38 243.8,38" marker-end="url(#arrow)" />
  <path class="link" d="M382.5,38 C400.5,38 400.5,38 418.5,38" marker-end="url(#arrow)" />
  <path class="link" d="M599.7,38 C617.7,38 617.7,38 635.7,38" marker-end="url(#arrow)" />
  <path class="link" d="M829.7,38 C847.7,38 847.7,38 865.7,38" marker-end="url(#arrow)" />
  <rect class="box" x="6" y="6" width="201.8" height="64" rx="10" />
  <text text-anchor="middle"><tspan class="name" x="106.9" y="33">Capteurs d'orientation</tspan><tspan class="info" x="106.9" y="51">(head tracking)</tspan></text>
  <rect class="box" x="251.8" y="6" width="130.7" height="64" rx="10" />
  <text text-anchor="middle"><tspan class="name" x="317.15" y="42">Caméra du jeu</tspan></text>
  <rect class="box" x="426.5" y="6" width="173.2" height="64" rx="10" />
  <text text-anchor="middle"><tspan class="name" x="513.1" y="33">Rendu stéréo</tspan><tspan class="info" x="513.1" y="51">œil gauche / œil droit</tspan></text>
  <rect class="box" x="643.7" y="6" width="186" height="64" rx="10" />
  <text text-anchor="middle"><tspan class="name" x="736.7" y="33">Shader de distorsion</tspan><tspan class="info" x="736.7" y="51">des lentilles</tspan></text>
  <rect class="hub" x="873.7" y="6" width="120" height="64" rx="24" />
  <text text-anchor="middle"><tspan class="name" x="933.7" y="33">Casque</tspan><tspan class="info" x="933.7" y="51">Oculus Rift</tspan></text>
</svg>
