<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 548 240" width="548" height="240" role="img" aria-label="Contract-first multi-agent setup">
<style>
  .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
  .hub { fill: #ddf4ff; stroke: #0969da; stroke-width: 2; }
  .now { stroke: #0969da; stroke-width: 2; }
  .date { fill: #0969da; font: 700 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .name { fill: #1f2328; font: 700 14px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .info { fill: #59636e; font: 400 12.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .lbl { fill: #59636e; font: italic 400 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .lblbg { fill: #ffffff; }
  .link { stroke: #8c959f; stroke-width: 2; fill: none; }
  .head { fill: #8c959f; }
  @media (prefers-color-scheme: dark) {
    .box { fill: #161b22; stroke: #30363d; }
    .hub { fill: #0c2d6b; stroke: #4493f8; }
    .now { stroke: #4493f8; }
    .date { fill: #4493f8; }
    .name { fill: #e6edf3; }
    .info, .lbl { fill: #9198a1; }
    .lblbg { fill: #0d1117; }
    .link { stroke: #6e7681; }
    .head { fill: #6e7681; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z" /></marker></defs>
  <path class="link" d="M172.6,120 C190.6,120 190.6,38 208.6,38" marker-end="url(#arrow)" />
  <path class="link" d="M172.6,120 C190.6,120 190.6,120 208.6,120" marker-end="url(#arrow)" />
  <path class="link" d="M172.6,120 C190.6,120 190.6,202 208.6,202" marker-end="url(#arrow)" />
  <path class="link" d="M371,38 C389,38 389,120 407,120" marker-end="url(#arrow)" />
  <path class="link" d="M371,120 C389,120 389,120 407,120" marker-end="url(#arrow)" />
  <path class="link" d="M371,202 C389,202 389,120 407,120" marker-end="url(#arrow)" />
  <rect class="hub" x="6" y="88" width="166.6" height="64" rx="24" />
  <text text-anchor="middle"><tspan class="name" x="89.3" y="115">Fullstack agent</tspan><tspan class="info" x="89.3" y="133">defines the contracts</tspan></text>
  <rect class="box" x="216.6" y="6" width="154.4" height="64" rx="10" />
  <text text-anchor="middle"><tspan class="name" x="293.8" y="42">Front agent</tspan></text>
  <rect class="box" x="216.6" y="88" width="154.4" height="64" rx="10" />
  <text text-anchor="middle"><tspan class="name" x="293.8" y="124">Back agent</tspan></text>
  <rect class="box" x="216.6" y="170" width="154.4" height="64" rx="10" />
  <text text-anchor="middle"><tspan class="name" x="293.8" y="197">Front door agent</tspan><tspan class="info" x="293.8" y="215">(Cloudflare)</tspan></text>
  <rect class="box" x="415" y="88" width="127" height="64" rx="10" />
  <text text-anchor="middle"><tspan class="name" x="478.5" y="115">Code review</tspan><tspan class="info" x="478.5" y="133">and test agents</tspan></text>
</svg>
