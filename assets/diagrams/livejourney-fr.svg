<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 210" width="950" height="210" role="img" aria-label="Architecture de Livejourney">
<style>
  .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
  .hub { fill: #ddf4ff; stroke: #0969da; stroke-width: 2; }
  .now { stroke: #0969da; stroke-width: 2; }
  .date { fill: #0969da; font: 700 15px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .name { fill: #1f2328; font: 700 14px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .info { fill: #59636e; font: 400 12.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .lbl { fill: #59636e; font: italic 400 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .lblbg { fill: #ffffff; }
  .link { stroke: #8c959f; stroke-width: 2; fill: none; }
  .head { fill: #8c959f; }
  @media (prefers-color-scheme: dark) {
    .box { fill: #161b22; stroke: #30363d; }
    .hub { fill: #0c2d6b; stroke: #4493f8; }
    .now { stroke: #4493f8; }
    .date { fill: #4493f8; }
    .name { fill: #e6edf3; }
    .info, .lbl { fill: #9198a1; }
    .lblbg { fill: #0d1117; }
    .link { stroke: #6e7681; }
    .head { fill: #6e7681; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z" /></marker></defs>
  <path class="link" d="M126,105 C144,105 144,105 162,105" marker-end="url(#arrow)" />
  <path class="link" d="M316.5,105 C334.5,105 334.5,51 352.5,51" marker-end="url(#arrow)" />
  <path class="link" d="M316.5,105 C334.5,105 334.5,159 352.5,159" marker-end="url(#arrow)" />
  <path class="link" d="M554.4,51 C572.4,51 572.4,105 590.4,105" marker-end="url(#arrow)" />
  <path class="link" d="M554.4,159 C572.4,159 572.4,105 590.4,105" marker-end="url(#arrow)" />
  <path class="link" d="M744.9,105 C762.9,105 762.9,105 780.9,105" marker-end="url(#arrow)" />
  <path class="box" d="M6,67 a60,7 0 0,1 120,0 v76 a60,7 0 0,1 -120,0 z" />
  <path class="box" d="M6,67 a60,7 0 0,0 120,0" />
  <text text-anchor="middle"><tspan class="name" x="66" y="104">Données</tspan><tspan class="info" x="66" y="122">des clients</tspan></text>
  <rect class="box" x="170" y="60" width="146.5" height="90" rx="10" />
  <text text-anchor="middle"><tspan class="name" x="243.25" y="109">Back-end Python</tspan></text>
  <rect class="box" x="360.5" y="6" width="193.9" height="90" rx="10" />
  <text text-anchor="middle"><tspan class="name" x="457.45" y="37">Analyse de l'existant</tspan><tspan class="info" x="457.45" y="55">séries temporelles</tspan><tspan class="info" x="457.45" y="73">ex. ponctualité RER D</tspan></text>
  <rect class="box" x="360.5" y="114" width="193.9" height="90" rx="10" />
  <text text-anchor="middle"><tspan class="name" x="457.45" y="145">Prédiction</tspan><tspan class="info" x="457.45" y="163">réseaux de neurones</tspan><tspan class="info" x="457.45" y="181">profonds (TensorFlow)</tspan></text>
  <rect class="box" x="598.4" y="60" width="146.5" height="90" rx="10" />
  <text text-anchor="middle"><tspan class="name" x="671.65" y="100">Front-end Unity</tspan><tspan class="info" x="671.65" y="118">datavisualisation</tspan></text>
  <rect class="hub" x="788.9" y="60" width="154.4" height="90" rx="24" />
  <text text-anchor="middle"><tspan class="name" x="866.1" y="91">Tableaux de bord</tspan><tspan class="info" x="866.1" y="109">personnalisés</tspan><tspan class="info" x="866.1" y="127">par client</tspan></text>
</svg>
